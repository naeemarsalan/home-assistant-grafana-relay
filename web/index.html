<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Grafana alert history</title>
  <style>
    :root {
      --background: #f3f5f8;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text: #18202b;
      --muted: #637083;
      --border: #dce2ea;
      --accent: #e85d24;
      --accent-soft: #fff0e9;
      --ok: #168052;
      --ok-soft: #e7f7ef;
      --warn: #a66505;
      --warn-soft: #fff5d9;
      --error: #bd3030;
      --error-soft: #ffebeb;
      --shadow: 0 12px 30px rgba(31, 42, 55, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #101318;
        --surface: #191e25;
        --surface-subtle: #14191f;
        --text: #edf1f6;
        --muted: #a5afbd;
        --border: #303843;
        --accent: #ff7b42;
        --accent-soft: #3b251d;
        --ok: #58cf98;
        --ok-soft: #17352a;
        --warn: #f3bd55;
        --warn-soft: #3b301b;
        --error: #ff8585;
        --error-soft: #422323;
        --shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      max-width: 620px;
    }

    button,
    input,
    select {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    button {
      min-height: 42px;
      padding: 8px 15px;
      cursor: pointer;
      font-weight: 700;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: 0.65; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 210px);
      gap: 12px;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .field {
      display: grid;
      gap: 5px;
    }

    label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
    }

    input:focus,
    select:focus,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      min-height: 28px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    #status[data-error="true"] { color: var(--error); }

    .notifications {
      display: grid;
      gap: 14px;
    }

    .notification {
      overflow: hidden;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .notification[data-state="ok"] { border-left-color: var(--ok); }
    .notification[data-state="alerting"] { border-left-color: var(--error); }
    .notification[data-state="pending"] { border-left-color: var(--warn); }

    .card-body { padding: 20px 22px 18px; }

    .card-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .time {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex: 0 0 auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge.delivered { background: var(--ok-soft); color: var(--ok); }
    .badge.failed { background: var(--error-soft); color: var(--error); }

    .message {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    details {
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    summary {
      padding: 11px 22px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 700;
      user-select: none;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 20px;
      padding: 2px 22px 18px;
      margin: 0;
    }

    .details-grid div { min-width: 0; }
    .details-grid .wide { grid-column: 1 / -1; }

    dt {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    dd {
      margin: 2px 0 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    a { color: var(--accent); }

    .empty {
      padding: 54px 24px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
    }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 1.05rem;
    }

    @media (max-width: 650px) {
      .shell { width: min(100% - 22px, 980px); padding-top: 24px; }
      header { display: grid; }
      .toolbar { grid-template-columns: 1fr; }
      .card-heading { display: grid; }
      .badges { justify-content: flex-start; }
      .card-body { padding: 17px 16px 15px; }
      summary { padding-inline: 16px; }
      .details-grid { grid-template-columns: 1fr; padding-inline: 16px; }
      .details-grid .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Home Assistant relay</p>
        <h1>Grafana alert history</h1>
        <p class="subtitle">Full notification messages and delivery status, newest first.</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <section class="toolbar" aria-label="History filters">
      <div class="field">
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Title, message, rule…" autocomplete="off">
      </div>
      <div class="field">
        <label for="state">State</label>
        <select id="state">
          <option value="">All states</option>
        </select>
      </div>
    </section>

    <div class="summary" aria-live="polite">
      <span id="count">Loading notifications…</span>
      <span id="status"></span>
    </div>
    <section id="notifications" class="notifications" aria-label="Notifications"></section>
  </main>

  <script>
    (() => {
      "use strict";

      const endpoint = new URL("./api/notifications", window.location.href);
      const refreshButton = document.querySelector("#refresh");
      const searchInput = document.querySelector("#search");
      const stateSelect = document.querySelector("#state");
      const countElement = document.querySelector("#count");
      const statusElement = document.querySelector("#status");
      const listElement = document.querySelector("#notifications");
      let notifications = [];

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      };

      const safeURL = (value) => {
        if (!value) return null;
        try {
          const url = new URL(value, window.location.href);
          return url.protocol === "http:" || url.protocol === "https:" ? url : null;
        } catch (_) {
          return null;
        }
      };

      const formatTime = (value) => {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Unknown time";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "medium"
        }).format(date);
      };

      const detail = (label, value, wide = false) => {
        if (value === undefined || value === null || value === "") return null;
        const wrapper = element("div", wide ? "wide" : "");
        wrapper.append(element("dt", "", label), element("dd", "", value));
        return wrapper;
      };

      const renderCard = (record) => {
        const alert = record.alert || {};
        const state = String(alert.state || "unknown");
        const card = element("article", "notification");
        card.dataset.state = state.toLowerCase();

        const body = element("div", "card-body");
        const heading = element("div", "card-heading");
        const headingText = element("div");
        headingText.append(
          element("h2", "", alert.title || alert.ruleName || "Untitled Grafana alert"),
          element("p", "time", formatTime(record.receivedAt))
        );

        const badges = element("div", "badges");
        badges.append(element("span", "badge", state));
        badges.append(element(
          "span",
          `badge ${record.delivered ? "delivered" : "failed"}`,
          record.delivered ? "Delivered" : "Delivery failed"
        ));
        heading.append(headingText, badges);
        body.append(heading, element("p", "message", alert.message || "No message was supplied."));

        let detailsImage = null;
        const imageURL = safeURL(alert.imageUrl);
        if (imageURL) {
          const link = element("a", "", "Open alert image");
          link.href = imageURL.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          const imageDetail = element("div", "wide");
          imageDetail.append(element("dt", "", "Image"));
          const imageValue = element("dd");
          imageValue.append(link);
          imageDetail.append(imageValue);
          detailsImage = imageDetail;
        }
        card.append(body);

        const disclosure = element("details");
        disclosure.append(element("summary", "", "Alert details"));
        const details = element("dl", "details-grid");
        const ruleURL = safeURL(alert.ruleUrl);
        const rule = detail("Rule", alert.ruleName || alert.ruleId);
        if (rule && ruleURL) {
          const value = rule.querySelector("dd");
          value.textContent = "";
          const link = element("a", "", alert.ruleName || `Rule ${alert.ruleId}`);
          link.href = ruleURL.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          value.append(link);
        }

        [
          rule,
          detail("State", state),
          detail("Dashboard", alert.dashboardId),
          detail("Panel", alert.panelId),
          detail("Organisation", alert.orgId),
          detailsImage,
          detail("Delivery error", record.deliveryError, true),
          detail("Tags", alert.tags && Object.keys(alert.tags).length ? JSON.stringify(alert.tags, null, 2) : "", true),
          detail("Evaluation matches", alert.evalMatches && alert.evalMatches.length ? JSON.stringify(alert.evalMatches, null, 2) : "", true),
          detail("History ID", record.id, true)
        ].forEach((item) => { if (item) details.append(item); });
        disclosure.append(details);
        card.append(disclosure);
        return card;
      };

      const filteredNotifications = () => {
        const query = searchInput.value.trim().toLowerCase();
        const state = stateSelect.value.toLowerCase();
        return notifications.filter((record) => {
          const alert = record.alert || {};
          if (state && String(alert.state || "unknown").toLowerCase() !== state) return false;
          if (!query) return true;
          return [alert.title, alert.message, alert.ruleName, alert.state]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
        });
      };

      const render = () => {
        const filtered = filteredNotifications();
        listElement.replaceChildren();
        countElement.textContent = filtered.length === notifications.length
          ? `${notifications.length} notification${notifications.length === 1 ? "" : "s"}`
          : `${filtered.length} of ${notifications.length} notifications`;

        if (!filtered.length) {
          const empty = element("div", "empty");
          empty.append(
            element("strong", "", notifications.length ? "No alerts match these filters" : "No notifications yet"),
            document.createTextNode(notifications.length
              ? "Try a different search or state."
              : "New Grafana webhooks will appear here automatically.")
          );
          listElement.append(empty);
          return;
        }
        filtered.forEach((record) => listElement.append(renderCard(record)));
      };

      const updateStates = () => {
        const selected = stateSelect.value;
        const states = [...new Set(notifications.map((record) => String(record.alert?.state || "unknown")))]
          .sort((left, right) => left.localeCompare(right));
        stateSelect.replaceChildren(new Option("All states", ""));
        states.forEach((state) => stateSelect.add(new Option(state, state)));
        if (states.includes(selected)) stateSelect.value = selected;
      };

      const load = async () => {
        refreshButton.disabled = true;
        statusElement.dataset.error = "false";
        statusElement.textContent = "Refreshing…";
        try {
          const response = await fetch(endpoint, { headers: { "Accept": "application/json" }, cache: "no-store" });
          if (!response.ok) throw new Error(`History request failed (${response.status})`);
          const payload = await response.json();
          notifications = Array.isArray(payload.notifications) ? payload.notifications : [];
          updateStates();
          render();
          statusElement.textContent = `Updated ${new Intl.DateTimeFormat(undefined, { timeStyle: "short" }).format(new Date())}`;
        } catch (error) {
          statusElement.dataset.error = "true";
          statusElement.textContent = error instanceof Error ? error.message : "Could not load history";
          if (!notifications.length) render();
        } finally {
          refreshButton.disabled = false;
        }
      };

      refreshButton.addEventListener("click", load);
      searchInput.addEventListener("input", render);
      stateSelect.addEventListener("change", render);
      load();
      window.setInterval(load, 30000);
    })();
  </script>
</body>
</html>
