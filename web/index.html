<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Grafana alert history</title>
  <style>
    :root {
      --background: #f3f5f8;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text: #18202b;
      --muted: #637083;
      --border: #dce2ea;
      --accent: #e85d24;
      --accent-soft: #fff0e9;
      --ok: #168052;
      --ok-soft: #e7f7ef;
      --warn: #a66505;
      --warn-soft: #fff5d9;
      --error: #bd3030;
      --error-soft: #ffebeb;
      --shadow: 0 12px 30px rgba(31, 42, 55, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #101318;
        --surface: #191e25;
        --surface-subtle: #14191f;
        --text: #edf1f6;
        --muted: #a5afbd;
        --border: #303843;
        --accent: #ff7b42;
        --accent-soft: #3b251d;
        --ok: #58cf98;
        --ok-soft: #17352a;
        --warn: #f3bd55;
        --warn-soft: #3b301b;
        --error: #ff8585;
        --error-soft: #422323;
        --shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      max-width: 620px;
    }

    button,
    input,
    select {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    button {
      min-height: 42px;
      padding: 8px 15px;
      cursor: pointer;
      font-weight: 700;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: 0.65; }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }

    #mark-all {
      border-color: var(--ok);
      color: var(--ok);
    }

    #mark-all[hidden] { display: none; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 210px);
      gap: 12px;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .field {
      display: grid;
      gap: 5px;
    }

    label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
    }

    input:focus,
    select:focus,
    button:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      min-height: 28px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    #status[data-error="true"] { color: var(--error); }

    .notifications {
      display: grid;
      gap: 14px;
    }

    .notification {
      overflow: hidden;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .notification[data-state="ok"] { border-left-color: var(--ok); }
    .notification[data-state="alerting"] { border-left-color: var(--error); }
    .notification[data-state="pending"] { border-left-color: var(--warn); }

    .notification[data-seen="true"] { box-shadow: none; }

    .group-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 18px 20px;
      color: var(--text);
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .group-summary::-webkit-details-marker { display: none; }

    .group-summary-main {
      display: block;
      min-width: 0;
    }

    .group-summary-side {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .group-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .group-title-block { display: block; }

    .preview {
      display: block;
      overflow: hidden;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .disclosure-icon {
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      transition: transform 140ms ease;
    }

    .notification[open] .disclosure-icon { transform: rotate(90deg); }

    .group-content {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .group-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .group-actions p {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .mark-seen {
      border-color: var(--ok);
      color: var(--ok);
      flex: 0 0 auto;
    }

    .occurrences {
      display: grid;
      gap: 10px;
    }

    .occurrence {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .occurrence > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .occurrence-summary-label {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .occurrence-body {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .group-title {
      display: block;
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .time {
      display: block;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex: 0 0 auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge.delivered { background: var(--ok-soft); color: var(--ok); }
    .badge.failed { background: var(--error-soft); color: var(--error); }
    .badge.unseen { background: var(--warn-soft); color: var(--warn); }
    .badge.seen { background: var(--ok-soft); color: var(--ok); }

    .message {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .technical-details {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-subtle);
    }

    .technical-details > summary {
      padding: 9px 11px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 700;
      user-select: none;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 20px;
      padding: 4px 12px 13px;
      margin: 0;
    }

    .details-grid div { min-width: 0; }
    .details-grid .wide { grid-column: 1 / -1; }

    dt {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    dd {
      margin: 2px 0 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    a { color: var(--accent); }

    .empty {
      padding: 54px 24px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
    }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 1.05rem;
    }

    @media (max-width: 650px) {
      .shell { width: min(100% - 22px, 980px); padding-top: 24px; }
      header { display: grid; }
      .header-actions { justify-content: flex-start; }
      .toolbar { grid-template-columns: 1fr; }
      .group-summary { grid-template-columns: 1fr; padding: 15px; }
      .group-title-row { display: grid; }
      .group-summary-side { justify-content: space-between; }
      .badges { justify-content: flex-start; }
      .group-content { padding: 13px; }
      .group-actions { align-items: flex-start; flex-direction: column; }
      .details-grid { grid-template-columns: 1fr; }
      .details-grid .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Home Assistant relay</p>
        <h1>Grafana alert history</h1>
        <p class="subtitle">Repeated alerts are grouped. Select one to expand its full history.</p>
      </div>
      <div class="header-actions">
        <button id="mark-all" type="button" hidden>✓ Mark all seen</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <section class="toolbar" aria-label="History filters">
      <div class="field">
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Title, message, rule…" autocomplete="off">
      </div>
      <div class="field">
        <label for="state">State</label>
        <select id="state">
          <option value="">All states</option>
        </select>
      </div>
    </section>

    <div class="summary" aria-live="polite">
      <span id="count">Loading notifications…</span>
      <span id="status"></span>
    </div>
    <section id="notifications" class="notifications" aria-label="Notifications"></section>
  </main>

  <script>
    (() => {
      "use strict";

      const endpoint = new URL("./api/notifications", window.location.href);
      const refreshButton = document.querySelector("#refresh");
      const markAllButton = document.querySelector("#mark-all");
      const searchInput = document.querySelector("#search");
      const stateSelect = document.querySelector("#state");
      const countElement = document.querySelector("#count");
      const statusElement = document.querySelector("#status");
      const listElement = document.querySelector("#notifications");
      const expandedGroups = new Set();
      let notifications = [];
      let mutationInProgress = false;
      let loadSequence = 0;

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      };

      const safeURL = (value) => {
        if (!value) return null;
        try {
          const url = new URL(value, window.location.href);
          return url.protocol === "http:" || url.protocol === "https:" ? url : null;
        } catch (_) {
          return null;
        }
      };

      const formatTime = (value) => {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Unknown time";
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "medium"
        }).format(date);
      };

      const detail = (label, value, wide = false) => {
        if (value === undefined || value === null || value === "") return null;
        const wrapper = element("div", wide ? "wide" : "");
        wrapper.append(element("dt", "", label), element("dd", "", value));
        return wrapper;
      };

      const legacyGroupKey = (record) => {
        const alert = record.alert || {};
        return JSON.stringify([
          alert.orgId || 0,
          alert.ruleId || 0,
          alert.ruleName || alert.title || alert.message || "",
          alert.dashboardId || 0,
          alert.panelId || 0,
          String(alert.state || "unknown").toLowerCase(),
          alert.tags || {},
          (alert.evalMatches || []).map((match) => [match.metric || "", match.tags || {}])
        ]);
      };

      const recordMatchesFilters = (record) => {
        const alert = record.alert || {};
        const selectedState = stateSelect.value.toLowerCase();
        if (selectedState && String(alert.state || "unknown").toLowerCase() !== selectedState) return false;

        const query = searchInput.value.trim().toLowerCase();
        if (!query) return true;
        return [alert.title, alert.message, alert.ruleName, alert.state]
          .filter(Boolean)
          .some((value) => String(value).toLowerCase().includes(query));
      };

      const groupRecords = (records) => {
        const byKey = new Map();
        records.forEach((record) => {
          const key = record.groupKey || legacyGroupKey(record);
          if (!byKey.has(key)) byKey.set(key, { key, records: [] });
          byKey.get(key).records.push(record);
        });

        const groups = [...byKey.values()];
        groups.forEach((group) => group.records.sort((left, right) =>
          new Date(right.receivedAt).getTime() - new Date(left.receivedAt).getTime()));
        groups.sort((left, right) =>
          new Date(right.records[0].receivedAt).getTime() - new Date(left.records[0].receivedAt).getTime());
        return groups;
      };

      const visibleGroups = () => groupRecords(notifications.filter(recordMatchesFilters));

      const renderTechnicalDetails = (record) => {
        const alert = record.alert || {};
        const disclosure = element("details", "technical-details");
        disclosure.append(element("summary", "", "Technical details"));
        const details = element("dl", "details-grid");

        const ruleURL = safeURL(alert.ruleUrl);
        const rule = detail("Rule", alert.ruleName || alert.ruleId);
        if (rule && ruleURL) {
          const value = rule.querySelector("dd");
          value.textContent = "";
          const link = element("a", "", alert.ruleName || `Rule ${alert.ruleId}`);
          link.href = ruleURL.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          value.append(link);
        }

        let imageDetail = null;
        const imageURL = safeURL(alert.imageUrl);
        if (imageURL) {
          imageDetail = element("div", "wide");
          imageDetail.append(element("dt", "", "Image"), element("dd"));
          const imageValue = imageDetail.querySelector("dd");
          const imageLink = element("a", "", "Open alert image");
          imageLink.href = imageURL.href;
          imageLink.target = "_blank";
          imageLink.rel = "noopener noreferrer";
          imageValue.append(imageLink);
        }

        [
          rule,
          detail("State", alert.state || "unknown"),
          detail("Dashboard", alert.dashboardId),
          detail("Panel", alert.panelId),
          detail("Organisation", alert.orgId),
          imageDetail,
          detail("Delivery error", record.deliveryError, true),
          detail("Tags", alert.tags && Object.keys(alert.tags).length ? JSON.stringify(alert.tags, null, 2) : "", true),
          detail("Evaluation matches", alert.evalMatches && alert.evalMatches.length ? JSON.stringify(alert.evalMatches, null, 2) : "", true),
          detail("History ID", record.id, true)
        ].forEach((item) => { if (item) details.append(item); });
        disclosure.append(details);
        return disclosure;
      };

      const renderOccurrence = (record, index, total) => {
        const alert = record.alert || {};
        const occurrence = element("details", "occurrence");
        occurrence.open = index === 0;
        const occurrenceSummary = element("summary");
        const label = element("span", "occurrence-summary-label");
        label.append(
          element("span", "", index === 0 ? "Latest" : `Earlier ${index + 1} of ${total}`),
          element("span", "time", formatTime(record.receivedAt))
        );
        occurrenceSummary.append(label, element(
          "span",
          `badge ${record.delivered ? "delivered" : "failed"}`,
          record.delivered ? "Delivered" : "Delivery failed"
        ));

        const body = element("div", "occurrence-body");
        body.append(
          element("p", "message", alert.message || "No message was supplied."),
          renderTechnicalDetails(record)
        );
        occurrence.append(occurrenceSummary, body);
        return occurrence;
      };

      const renderGroup = (group) => {
        const latest = group.records[0];
        const alert = latest.alert || {};
        const state = String(alert.state || "unknown");
        const unseen = group.records.filter((record) => !record.seen);
        const card = element("details", "notification");
        card.dataset.state = state.toLowerCase();
        card.dataset.seen = String(unseen.length === 0);
        card.open = expandedGroups.has(group.key);
        card.addEventListener("toggle", () => {
          if (card.open) expandedGroups.add(group.key);
          else expandedGroups.delete(group.key);
        });

        const summary = element("summary", "group-summary");
        const main = element("span", "group-summary-main");
        const titleRow = element("span", "group-title-row");
        const title = element("span", "group-title-block");
        title.append(
          element("span", "group-title", alert.title || alert.ruleName || "Untitled Grafana alert"),
          element("span", "time", `Latest ${formatTime(latest.receivedAt)}`)
        );
        titleRow.append(title);
        main.append(titleRow, element("span", "preview", alert.message || "No message was supplied."));

        const side = element("span", "group-summary-side");
        const badges = element("span", "badges");
        badges.append(element("span", "badge", state));
        if (group.records.length > 1) {
          badges.append(element("span", "badge", `${group.records.length} alerts`));
        }
        badges.append(element(
          "span",
          `badge ${unseen.length ? "unseen" : "seen"}`,
          unseen.length ? `${unseen.length} unseen` : "Seen"
        ));
        side.append(badges, element("span", "disclosure-icon", "›"));
        summary.append(main, side);

        const content = element("div", "group-content");
        const actions = element("div", "group-actions");
        actions.append(element(
          "p",
          "",
          `${group.records.length} occurrence${group.records.length === 1 ? "" : "s"} in this group`
        ));
        if (unseen.length) {
          const markButton = element(
            "button",
            "mark-seen",
            unseen.length === 1 ? "✓ Mark seen" : `✓ Mark ${unseen.length} seen`
          );
          markButton.type = "button";
          markButton.disabled = mutationInProgress;
          markButton.addEventListener("click", () => markRecordsSeen(
            unseen.map((record) => record.id),
            `Marked ${unseen.length} alert${unseen.length === 1 ? "" : "s"} as seen`
          ));
          actions.append(markButton);
        }
        const occurrences = element("div", "occurrences");
        group.records.forEach((record, index) =>
          occurrences.append(renderOccurrence(record, index, group.records.length)));
        content.append(actions, occurrences);
        card.append(summary, content);
        return card;
      };

      const render = () => {
        const groups = visibleGroups();
        const visibleRecordCount = groups.reduce((total, group) => total + group.records.length, 0);
        const unseenGroups = groups.filter((group) => group.records.some((record) => !record.seen));
        listElement.replaceChildren();

        const groupLabel = `${groups.length} alert group${groups.length === 1 ? "" : "s"}`;
        const notificationLabel = `${visibleRecordCount} notification${visibleRecordCount === 1 ? "" : "s"}`;
        countElement.textContent = `${groupLabel} · ${notificationLabel}`;

        markAllButton.hidden = unseenGroups.length <= 1;
        markAllButton.disabled = mutationInProgress;
        if (!markAllButton.hidden) {
          markAllButton.textContent = `✓ Mark all ${unseenGroups.length} visible groups seen`;
        }

        if (!groups.length) {
          const empty = element("div", "empty");
          empty.append(
            element("strong", "", notifications.length ? "No alerts match these filters" : "No notifications yet"),
            document.createTextNode(notifications.length
              ? "Try a different search or state."
              : "New Grafana webhooks will appear here automatically.")
          );
          listElement.append(empty);
          return;
        }
        groups.forEach((group) => listElement.append(renderGroup(group)));
      };

      const markRecordsSeen = async (ids, successMessage) => {
        const selectedIDs = [...new Set(ids)].filter(Boolean);
        if (!selectedIDs.length || mutationInProgress) return;

        mutationInProgress = true;
        loadSequence += 1;
        refreshButton.disabled = true;
        render();
        statusElement.dataset.error = "false";
        statusElement.textContent = "Saving…";
        try {
          const response = await fetch(endpoint, {
            method: "PATCH",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({ ids: selectedIDs })
          });
          if (!response.ok) throw new Error(`Could not mark alerts seen (${response.status})`);
          const selected = new Set(selectedIDs);
          notifications.forEach((record) => {
            if (selected.has(record.id)) record.seen = true;
          });
          statusElement.textContent = successMessage;
        } catch (error) {
          statusElement.dataset.error = "true";
          statusElement.textContent = error instanceof Error ? error.message : "Could not save seen state";
        } finally {
          mutationInProgress = false;
          refreshButton.disabled = false;
          render();
        }
      };

      const updateStates = () => {
        const selected = stateSelect.value;
        const states = [...new Set(notifications.map((record) =>
          String((record.alert || {}).state || "unknown")))]
          .sort((left, right) => left.localeCompare(right));
        stateSelect.replaceChildren(new Option("All states", ""));
        states.forEach((state) => stateSelect.add(new Option(state, state)));
        if (states.includes(selected)) stateSelect.value = selected;
      };

      const load = async () => {
        if (mutationInProgress) return;
        const sequence = ++loadSequence;
        refreshButton.disabled = true;
        markAllButton.disabled = true;
        statusElement.dataset.error = "false";
        statusElement.textContent = "Refreshing…";
        try {
          const response = await fetch(endpoint, {
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
            cache: "no-store"
          });
          if (!response.ok) throw new Error(`History request failed (${response.status})`);
          const payload = await response.json();
          if (sequence !== loadSequence || mutationInProgress) return;
          notifications = Array.isArray(payload.notifications) ? payload.notifications : [];
          updateStates();
          render();
          statusElement.textContent = `Updated ${new Intl.DateTimeFormat(undefined, { timeStyle: "short" }).format(new Date())}`;
        } catch (error) {
          if (sequence !== loadSequence || mutationInProgress) return;
          statusElement.dataset.error = "true";
          statusElement.textContent = error instanceof Error ? error.message : "Could not load history";
          if (!notifications.length) render();
        } finally {
          if (sequence === loadSequence && !mutationInProgress) {
            refreshButton.disabled = false;
            markAllButton.disabled = false;
          }
        }
      };

      refreshButton.addEventListener("click", load);
      markAllButton.addEventListener("click", () => {
        const unseenGroups = visibleGroups().filter((group) =>
          group.records.some((record) => !record.seen));
        const ids = unseenGroups.flatMap((group) =>
          group.records.filter((record) => !record.seen).map((record) => record.id));
        markRecordsSeen(ids, `Marked ${unseenGroups.length} visible alert groups as seen`);
      });
      searchInput.addEventListener("input", render);
      stateSelect.addEventListener("change", render);
      load();
      window.setInterval(load, 30000);
    })();
  </script>
</body>
</html>
